name: CI

# Her push ve pull request'te Windows + Ubuntu üzerinde çalışır.
# Hiçbir adım ağ erişimi, API anahtarı veya sır gerektirmez.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12"]
    env:
      # Windows koşucusunun eski kod sayfası Türkçe çıktıyı bozmasın.
      PYTHONUTF8: "1"
      # Bağlam dosyaları (agent.md vb.) CI çalışma alanında üretilmesin.
      EVREN_AUTO_DOCS: "false"
      # Duman testleri onay sormadan komut çalıştırmaz.
      EVREN_AUTO_APPROVE: "false"

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} kur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Sözdizimi derlemesi (compileall)
        run: python -m compileall -q src scripts

      - name: Kontrol karakteri ve sır taraması
        run: python scripts/check_text.py

      - name: Testler (pytest)
        run: python -m pytest -q

      - name: REPL açılış duman testi
        run: python -m pytest -q tests/test_repl_startup.py

      - name: CLI duman testi (ağ ve API anahtarı gerektirmez)
        shell: bash
        run: |
          python -m src.cli --version
          python -m src.cli --help
          python -m src.cli agent --help
          python -m src.cli scan .
          python -m src.cli ssh list
