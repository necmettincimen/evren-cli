[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evren-cli"
version = "3.9.7"
description = "AI Development & Project Assistant for EVREN LLM API"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "EVREN CLI Pair Programmer" }
]
dependencies = [
    "openai>=1.20.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.1",
    "prompt_toolkit>=3.0.40"
]

[project.scripts]
evren = "src.cli:main"
evren-cli = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["agents/*.md"]
