[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evren-cli"
version = "3.11.0"
description = "AI Development & Project Assistant for EVREN LLM API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "EVREN CLI Pair Programmer" }
]
dependencies = [
    "openai>=1.20.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.1",
    "prompt_toolkit>=3.0.40"
]

[project.scripts]
evren = "src.cli:main"
evren-cli = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["agents/*.md"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "jsonschema>=4.21", "build>=1.2"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["bench", "plans", "context", ".evren"]

[tool.ruff.lint]
# Hata sınıfı kurallar; stil kuralları kademeli eklenir.
select = ["E9", "F63", "F7", "F82", "F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
relative_files = true
